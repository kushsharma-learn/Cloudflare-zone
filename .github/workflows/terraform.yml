name: Terraform

# Plan on pull requests, apply on merge to main.
# Runs one job PER ZONE (a matrix "loop"), each with its own state file in R2 —
# but ONLY for the zones whose files changed, so adding/editing one zone never
# re-runs (or fails) the others. Use the manual "Run workflow" button to target
# a specific zone or all zones.
on:
  pull_request:
    paths:
      - "dns-zones/**"
      - "engine/**"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "dns-zones/**"
      - "engine/**"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      zone:
        description: "Zone folder to run (leave empty to run ALL zones)."
        required: false
        default: ""

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}

jobs:
  # Decide which zone folders to act on.
  discover:
    runs-on: ubuntu-latest
    outputs:
      zones: ${{ steps.find.outputs.zones }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: find
        shell: bash
        run: |
          set -euo pipefail

          all_zones() {
            find dns-zones -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort -u
          }

          # changed zone folders between two git refs
          changed_zones() {
            git diff --name-only "$1" "$2" -- 'dns-zones/' \
              | awk -F/ 'NF>=2 {print $2}' | sort -u
          }

          case "${{ github.event_name }}" in
            workflow_dispatch)
              if [ -n "${{ github.event.inputs.zone }}" ]; then
                sel="${{ github.event.inputs.zone }}"
              else
                sel="$(all_zones)"
              fi
              ;;
            pull_request)
              git fetch --depth=1 origin "${{ github.base_ref }}"
              sel="$(changed_zones "origin/${{ github.base_ref }}" HEAD)"
              ;;
            push)
              before="${{ github.event.before }}"
              if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
                sel="$(changed_zones "HEAD~1" HEAD || true)"
              else
                sel="$(changed_zones "$before" "${{ github.sha }}")"
              fi
              ;;
          esac

          # keep only folders that still exist (ignore deletions), build JSON array
          existing=""
          for z in $sel; do
            [ -d "dns-zones/$z" ] && existing="$existing$z"$'\n'
          done
          zones=$(printf '%s' "$existing" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "zones=$zones" >> "$GITHUB_OUTPUT"
          echo "Zones to run: $zones"

  terraform:
    needs: discover
    if: needs.discover.outputs.zones != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # GitHub caps a matrix at 256 jobs per run. For >256 changed zones at once,
      # split them across batches. max-parallel also respects API rate limits.
      max-parallel: 20
      matrix:
        zone: ${{ fromJson(needs.discover.outputs.zones) }}
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Collect -var-file arguments
        id: vars
        shell: bash
        run: |
          args=$(find "../dns-zones/${{ matrix.zone }}" -type f -name '*.tfvars' | sort \
            | sed 's/^/ -var-file=/' | tr -d '\n')
          echo "args=$args" >> "$GITHUB_OUTPUT"

      - name: Terraform Init (per-zone state)
        run: terraform init -reconfigure -input=false -backend-config="key=zones/${{ matrix.zone }}.tfstate"

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan -input=false -no-color ${{ steps.vars.outputs.args }} -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          ZONE: ${{ matrix.zone }}
        with:
          script: |
            const fs = require('fs');
            let plan = fs.readFileSync('engine/plan.txt', 'utf8');
            const max = 60000;
            if (plan.length > max) plan = plan.slice(0, max) + '\n... (truncated) ...';
            const body = `#### Terraform Plan — zone \`${process.env.ZONE}\`\n`
              + `<details><summary>Show plan</summary>\n\n\`\`\`terraform\n${plan}\n\`\`\`\n</details>`;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      # Applies on merge to main, or when triggered manually.
      - name: Terraform Apply
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
        run: terraform apply -input=false -auto-approve tfplan
